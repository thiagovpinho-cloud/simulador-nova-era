name: Validate Focado Frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "worker/**"
      - "index.html"
      - "tests/**"
      - "shared/**"
      - "package.json"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: focado-frontend-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run business and design tests
        run: npm test

      - name: Syntax check frontend modules
        shell: bash
        run: |
          node --check assets/design-system.js
          node --check assets/app-shell.js
          node --check assets/core/module-loader.js
          for f in assets/modules/*.js; do
            node --check "$f"
          done

      - name: Validate production package contents
        shell: bash
        run: |
          test -f assets/modules/indicators.js
          test -f assets/modules/indicators.css
          test -f shared/bi-analytics.js
          grep -q "indicadores:{css:'indicators.css',js:'indicators.js'}" assets/core/module-loader.js
          grep -q "shared/bi-analytics.js" assets/modules/indicators.js
