name: Validate Focado Frontend

on:
  push:
    branches: ['focado/fix-customer-postsave-20260909']
    paths:
      - ".github/workflows/validate-focado-frontend.yml"

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: focado/fix-customer-postsave-20260909
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply patch
        shell: bash
        run: |
          echo '  ' | tr -d ' ' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Validate
        run: |
          node --check assets/modules/customers.js
          node --check assets/modules/orders.js
          node --check shared/domain-rules.js
          node tests/customer-master-flow.test.mjs
          npm test
      - name: Commit validated changes
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/validate-focado-frontend.yml
          rm -f .github/workflows/patch-customer-master-flow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make Clients the commercial customer master"
          git push origin HEAD:focado/fix-customer-postsave-20260909
