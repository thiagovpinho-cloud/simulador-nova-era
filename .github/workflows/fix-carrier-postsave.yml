name: Fix carrier post-save

on:
  push:
    branches:
      - focado/fix-carrier-postsave-20260909

permissions:
  contents: write

jobs:
  patch-and-test:
    if: "${{ github.event.head_commit.message != 'fix: carrier post-save uses confirmed payload' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: focado/fix-carrier-postsave-20260909
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply surgical patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          p=Path('assets/modules/logistics.js')
          s=p.read_text()
          old="""  function renderCarriers(){\n    const ops=load(),rows=(ops.carriers||[]).slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));"""
          new="""  function renderCarriers(confirmedState){\n    const ops=confirmedState&&typeof confirmedState==='object'?confirmedState:load(),rows=(ops.carriers||[]).slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));"""
          if old not in s:
              raise SystemExit('renderCarriers pattern not found')
          s=s.replace(old,new,1)

          old2="""      const res=await window.FocadoDataStore.saveDomain('TRANSPORTADORAS',{carrier},null);\n      if(!res?.ok){alert('Não foi possível salvar a transportadora.');return}\n      await window.FocadoDataStore.load();renderCarriers();"""
          new2="""      const res=await window.FocadoDataStore.saveDomain('TRANSPORTADORAS',{carrier},null);\n      if(!res?.ok){alert('Não foi possível salvar a transportadora.');return}\n      renderCarriers(res.payload||window.FocadoDataStore.readLocal?.()||load());"""
          if old2 not in s:
              raise SystemExit('carrier post-save pattern not found')
          p.write_text(s.replace(old2,new2,1))

          Path('tests/carrier-postsave-regression.test.mjs').write_text('''import assert from "node:assert/strict";\nimport fs from "node:fs";\n\nconst source=fs.readFileSync(new URL("../assets/modules/logistics.js",import.meta.url),"utf8");\nassert.match(source,/function renderCarriers\\(confirmedState\\)/,"lista deve aceitar estado confirmado");\nassert.match(source,/renderCarriers\\(res\\.payload\\|\\|window\\.FocadoDataStore\\.readLocal\\?\\.\\(\\)\\|\\|load\\(\\)\\)/,"pós-save deve usar payload confirmado");\nassert.doesNotMatch(source,/saveDomain\\('TRANSPORTADORAS'[\\s\\S]{0,400}?await window\\.FocadoDataStore\\.load\\(\\)/,"pós-save não deve recarregar o estado inteiro");\nconst confirmed={carriers:[{id:"car_1",name:"Transportadora Teste",active:true}]};\nconst rows=(confirmed.carriers||[]).slice().sort((a,b)=>String(a.name||"").localeCompare(String(b.name||"")));\nassert.equal(rows.length,1);\nassert.equal(rows[0].name,"Transportadora Teste");\nconsole.log("carrier-postsave-regression: ok");\n''')

          pkg=Path('package.json')
          obj=json.loads(pkg.read_text())
          test='node tests/carrier-postsave-regression.test.mjs'
          if test not in obj['scripts']['test']:
              obj['scripts']['test'] += ' && '+test
          pkg.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Run regression suite
        run: npm test
      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/modules/logistics.js tests/carrier-postsave-regression.test.mjs package.json
          git commit -m "fix: carrier post-save uses confirmed payload"
          git push origin HEAD:focado/fix-carrier-postsave-20260909
