name: Deploy Focado Preview

on:
  push:
    branches:
      - focado/enxugamento-seguro
      - focado/recuperacao-funcional-passo-a-passo
    paths:
      - "assets/**"
      - "worker/**"
      - "index.html"
      - "manifest.webmanifest"
      - "shared/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/deploy-focado-preview.yml"

permissions:
  contents: read

concurrency:
  group: focado-cloudflare-pages-preview-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate-and-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout safe branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run full test suite
        run: npm test

      - name: Syntax check frontend modules
        shell: bash
        run: |
          node --check assets/design-system.js
          node --check assets/app-shell.js
          node --check assets/core/module-loader.js
          node --check assets/core/auth-client.js
          node --check assets/core/data-store.js
          node --check scripts/slim-preview-index.mjs
          for f in assets/modules/*.js; do
            node --check "$f"
          done

      - name: Install Wrangler
        working-directory: worker
        run: npm install --no-audit --no-fund

      - name: Build isolated static package
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html manifest.webmanifest focado-*.svg _site/
          cp -R assets _site/assets
          cp -R shared _site/shared
          for f in Catalogo_*.pdf Ficha_*.pdf; do
            [ -f "$f" ] && cp "$f" _site/
          done
          if [ "${GITHUB_REF_NAME}" = "focado/recuperacao-funcional-passo-a-passo" ]; then
            node scripts/slim-preview-index.mjs _site/index.html _site/index.html
            grep -q "FOCADO_BOOT_SLIM_V1" _site/index.html
            if grep -Eq '<script[^>]+src=["'"']assets/modules/' _site/index.html; then
              echo "ERRO: módulo operacional ainda presente no boot do preview"
              exit 1
            fi
            if grep -Eq '<link[^>]+href=["'"']assets/modules/' _site/index.html; then
              echo "ERRO: CSS operacional ainda presente no boot do preview"
              exit 1
            fi
          fi

      - name: Select preview alias
        id: preview
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" = "focado/recuperacao-funcional-passo-a-passo" ]; then
            echo "branch=focado-recuperacao-funcional" >> "$GITHUB_OUTPUT"
            echo "url=https://focado-recuperacao-funcional.focado.pages.dev" >> "$GITHUB_OUTPUT"
          else
            echo "branch=focado-enxugamento-seguro" >> "$GITHUB_OUTPUT"
            echo "url=https://focado-enxugamento-seguro.focado.pages.dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Cloudflare Pages preview
        shell: bash
        env:
          CF_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_BRANCH: ${{ steps.preview.outputs.branch }}
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CF_TOKEN_RAW" | tr -d '\r\n' | xargs)"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CF_ACCOUNT_RAW" | tr -d '\r\n' | xargs)"
          cd worker
          npx wrangler pages deploy ../_site --project-name focado --branch "$PREVIEW_BRANCH" --commit-dirty=true

      - name: Smoke test isolated preview
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 15 "$PREVIEW_URL/" -o /tmp/focado-preview-index.html; then
              if grep -q "Focado" /tmp/focado-preview-index.html; then
                echo "Preview shell OK: $PREVIEW_URL"
                curl -fsS --max-time 15 "$PREVIEW_URL/assets/core/module-loader.js" -o /tmp/focado-preview-loader.js
                grep -q "lazyIntelligenceActions" /tmp/focado-preview-loader.js
                echo "Lazy intelligence loader OK"
                if [ "${GITHUB_REF_NAME}" = "focado/recuperacao-funcional-passo-a-passo" ]; then
                  grep -q "FOCADO_BOOT_SLIM_V1" /tmp/focado-preview-index.html
                  if grep -Eq '<script[^>]+src=["'"']assets/modules/' /tmp/focado-preview-index.html; then
                    echo "Preview voltou a pré-carregar JS operacional"
                    exit 1
                  fi
                  if grep -Eq '<link[^>]+href=["'"']assets/modules/' /tmp/focado-preview-index.html; then
                    echo "Preview voltou a pré-carregar CSS operacional"
                    exit 1
                  fi
                  curl -fsS --max-time 15 "$PREVIEW_URL/assets/modules/orders.js" -o /tmp/focado-preview-orders.js
                  grep -q "FocadoOrders" /tmp/focado-preview-orders.js
                  curl -fsS --max-time 15 "$PREVIEW_URL/assets/modules/pcp.js" -o /tmp/focado-preview-pcp.js
                  grep -q "FocadoPCP" /tmp/focado-preview-pcp.js
                  curl -fsS --max-time 15 "$PREVIEW_URL/assets/modules/order-drafts.js" -o /tmp/focado-preview-drafts.js
                  grep -q "Pedidos ainda não enviados" /tmp/focado-preview-drafts.js
                  curl -fsS --max-time 15 "$PREVIEW_URL/assets/modules/pcp-history.js" -o /tmp/focado-preview-pcp-history.js
                  grep -q "Últimos 10 pedidos processados" /tmp/focado-preview-pcp-history.js
                  echo "Boot slim + módulos sob demanda OK"
                fi
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Preview smoke test failed: $PREVIEW_URL"
          exit 1
