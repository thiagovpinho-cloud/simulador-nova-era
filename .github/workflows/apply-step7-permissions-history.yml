name: Apply Step 7 Permissions History

on:
  push:
    branches:
      - "focado/passo-7-permissoes-historico"
    paths:
      - ".github/workflows/apply-step7-permissions-history.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "focado/passo-7-permissoes-historico"
      - name: Apply Step 7 patch
        run: python3 scripts/apply-step7.py
      - name: Validate syntax
        run: |
          node --check assets/core/auth-client.js
          node --check assets/modules/users.js
          node --check worker/src/index.js
      - name: Commit Step 7 implementation
        run: |
          git config user.name "Focado CI"
          git config user.email "actions@users.noreply.github.com"
          git add assets/core/auth-client.js assets/modules/users.js worker/src/index.js
          git commit -m "feat: add Director governance and immutable audit history"
          git push origin HEAD:focado/passo-7-permissoes-historico
