name: Deploy Focado Cloudflare Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Validate Focado Frontend"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: focado-cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        working-directory: worker
        run: npm install --no-audit --no-fund

      - name: Build static package
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html manifest.webmanifest focado-*.svg _site/
          cp -R assets _site/assets
          cp -R shared _site/shared
          for f in Catalogo_*.pdf Ficha_*.pdf; do
            [ -f "$f" ] && cp "$f" _site/
          done

      - name: Ensure Pages project
        shell: bash
        env:
          CF_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CF_TOKEN_RAW" | tr -d '\r\n' | xargs)"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CF_ACCOUNT_RAW" | tr -d '\r\n' | xargs)"
          if (cd worker && npx wrangler pages project list 2>/dev/null) | grep -Eq '(^|[[:space:]│])focado([[:space:]│]|$)'; then
            echo "Pages project focado already exists."
          else
            (cd worker && npx wrangler pages project create focado --production-branch main)
          fi

      - name: Deploy Pages
        shell: bash
        env:
          CF_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CF_TOKEN_RAW" | tr -d '\r\n' | xargs)"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CF_ACCOUNT_RAW" | tr -d '\r\n' | xargs)"
          cd worker
          npx wrangler pages deploy ../_site --project-name focado --branch main --commit-dirty=true

      - name: Smoke test published Focado
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://focado.pages.dev"
          for i in {1..12}; do
            if curl -fsS --retry 2 --retry-delay 2 "$BASE/" -o /tmp/focado-index.html; then
              break
            fi
            sleep 5
          done
          test -s /tmp/focado-index.html
          curl -fsS --retry 4 --retry-delay 3 "$BASE/assets/modules/simulator.js?v=20260828-simulator-v2" -o /tmp/simulator.js
          curl -fsS --retry 4 --retry-delay 3 "$BASE/assets/modules/simulator.css?v=20260828-simulator-v2" -o /tmp/simulator.css
          grep -q "window.FocadoSimulator={render}" /tmp/simulator.js
          grep -q ".fsim-page" /tmp/simulator.css
          grep -q "assets/modules/simulator.js?v=20260828-simulator-v2" /tmp/focado-index.html
          grep -q "assets/modules/simulator.css?v=20260828-simulator-v2" /tmp/focado-index.html
          python - <<'PY'
          from pathlib import Path
          html=Path('/tmp/focado-index.html').read_text(errors='replace')
          head=html.split('</head>',1)[0]
          assert r'\n' not in head, 'literal \\n detected in published <head>'
          assert 'window.FocadoLegacySimulator' in html, 'pricing adapter missing from published HTML'
          print('published-smoke: ok')
          PY
