name: Deploy Focado Cloudflare Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Validate Focado Frontend"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: focado-cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        working-directory: worker
        run: npm install --no-audit --no-fund

      - name: Build static package
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html manifest.webmanifest focado-*.svg _site/
          cp -R assets _site/assets
          cp -R shared _site/shared
          for f in Catalogo_*.pdf Ficha_*.pdf; do
            [ -f "$f" ] && cp "$f" _site/
          done

      - name: Ensure Pages project
        shell: bash
        env:
          CF_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CF_TOKEN_RAW" | tr -d '\r\n' | xargs)"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CF_ACCOUNT_RAW" | tr -d '\r\n' | xargs)"
          if (cd worker && npx wrangler pages project list 2>/dev/null) | grep -Eq '(^|[[:space:]│])focado([[:space:]│]|$)'; then
            echo "Pages project focado already exists."
          else
            (cd worker && npx wrangler pages project create focado --production-branch main)
          fi

      - name: Deploy Pages
        shell: bash
        env:
          CF_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CF_TOKEN_RAW" | tr -d '\r\n' | xargs)"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CF_ACCOUNT_RAW" | tr -d '\r\n' | xargs)"
          cd worker
          npx wrangler pages deploy ../_site --project-name focado --branch main --commit-dirty=true

      - name: Smoke test published Focado
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://focado.pages.dev"
          READY=0
          for i in {1..18}; do
            if curl -fsS --retry 2 --retry-delay 2 "$BASE/" -o /tmp/focado-index.html \
              && grep -q "assets/modules/simulator.js?v=20260828-simulator-v5" /tmp/focado-index.html \
              && grep -q "assets/modules/simulator.css?v=20260828-simulator-v3" /tmp/focado-index.html \
              && grep -q "assets/modules/margin-rules.js?v=20260828-margin-rules-v1" /tmp/focado-index.html \
              && grep -q "assets/modules/orders.js?v=20260828-profit-v1" /tmp/focado-index.html \
              && grep -q "assets/modules/orders.css?v=20260828-profit-v1" /tmp/focado-index.html; then
              READY=1
              echo "Production alias is serving simulator-v5."
              break
            fi
            echo "Waiting for focado.pages.dev to switch to validated revision... attempt $i/18"
            sleep 5
          done
          test "$READY" = "1"
          curl -fsS --retry 6 --retry-delay 3 "$BASE/assets/modules/simulator.js?v=20260828-simulator-v5" -o /tmp/simulator.js
          curl -fsS --retry 6 --retry-delay 3 "$BASE/assets/modules/simulator.css?v=20260828-simulator-v3" -o /tmp/simulator.css
          curl -fsS --retry 6 --retry-delay 3 "$BASE/assets/modules/margin-rules.js?v=20260828-margin-rules-v1" -o /tmp/margin-rules.js
          curl -fsS --retry 6 --retry-delay 3 "$BASE/assets/modules/margin-rules.css?v=20260828-margin-rules-v1" -o /tmp/margin-rules.css
          curl -fsS --retry 6 --retry-delay 3 "$BASE/assets/modules/orders.js?v=20260828-profit-v1" -o /tmp/orders.js
          curl -fsS --retry 6 --retry-delay 3 "$BASE/assets/modules/orders.css?v=20260828-profit-v1" -o /tmp/orders.css
          grep -q "window.FocadoSimulator={render}" /tmp/simulator.js
          grep -q "(document.getElementById('focadoShell')||document.body).appendChild(modal)" /tmp/simulator.js
          grep -q "Cadastrar insumo" /tmp/simulator.js
          grep -q "Manual por caixa" /tmp/simulator.js
          grep -q "data-comp-unit" /tmp/simulator.js
          grep -q "data-comp-qty" /tmp/simulator.js
          grep -q "data-comp-loss" /tmp/simulator.js
          grep -q ".fsim-page" /tmp/simulator.css
          grep -q "window.FocadoMarginRules={render}" /tmp/margin-rules.js
          grep -q "Custo do Produto" /tmp/margin-rules.js
          grep -q "Regras de Margem" /tmp/margin-rules.js
          grep -q ".fmr-page" /tmp/margin-rules.css
          grep -q "Preço final c/ impostos" /tmp/orders.js
          grep -q "updateProfitability" /tmp/orders.js
          grep -q "quoteOrder" /tmp/orders.js
          grep -q ".fo-margin-cell" /tmp/orders.css
          python - <<'PY'
          from pathlib import Path
          html=Path('/tmp/focado-index.html').read_text(errors='replace')
          head=html.split('</head>',1)[0]
          assert r'\n' not in head, 'literal \\n detected in published <head>'
          assert 'window.FocadoLegacySimulator' in html, 'pricing adapter missing from published HTML'
          assert 'focado-booting' in html, 'boot splash class missing from published HTML'
          assert 'focado-brand.svg?v=20260828-boot' in html, 'boot splash logo missing from published HTML'
          print('published-smoke: ok')
          PY
